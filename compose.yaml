name: w4tch3r

services:

  web:
    container_name: w4tch3r_web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: .
    env_file:
      - ./.env       
    ports:
      - 8000:8000
    develop:
      watch:
        - action: sync
          path: .
          target: /app

    depends_on:
      - database

    volumes:
      - .:/app

###> doctrine/doctrine-bundle ###
  database:
    container_name: w4tch3r_db
    image: 'mariadb:11.4.2'
    env_file:
      - ./.env        
    ports:
      - '3306'
    volumes:
      - database_data:/var/lib/mysql
###< doctrine/doctrine-bundle ###


  phpmyadmin:
    container_name: w4tch3r_phpmyadmin
    image: phpmyadmin
    ports:
      - 8888:80
    env_file:
      - ./.env


volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
